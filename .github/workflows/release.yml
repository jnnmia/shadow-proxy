name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.2.1, leave empty to use current ref)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, i686-pc-windows-gnu

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6") {
            echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH
          }
          if (Test-Path "C:\Program Files\Inno Setup 6") {
            echo "C:\Program Files\Inno Setup 6" >> $env:GITHUB_PATH
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build 64-bit Components
        run: cargo build --release --workspace

      - name: Set up MSYS2 for 32-bit MinGW
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc
          update: false

      - name: Add MinGW32 to GITHUB_PATH
        shell: pwsh
        run: |
          $msysPath = "${{ steps.msys2.outputs.msys2-location }}"
          $mingw32Bin = "$msysPath\mingw32\bin"
          Write-Host "Adding $mingw32Bin to GITHUB_PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $mingw32Bin
          Write-Host "MinGW32 GCC verification:"
          & "$mingw32Bin\i686-w64-mingw32-gcc.exe" --version

      - name: Build 32-bit Components
        run: cargo build --release --target i686-pc-windows-gnu -p shadow-hook -p shadow-injector

      - name: Package Release
        run: python scripts/package.py

      - name: Verify Artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path dist
          if (-not (Test-Path dist/ShadowProxy-Setup-v*.exe)) {
            throw "Installer .exe was not generated"
          }
          if (-not (Test-Path dist/ShadowProxy-v*.zip)) {
            throw "Portable .zip was not generated"
          }
          if (-not (Test-Path dist/SHA256SUMS.txt)) {
            throw "SHA256SUMS.txt was not generated"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            dist/ShadowProxy-Setup-v*.exe
            dist/ShadowProxy-v*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
